<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhisperLiveKit Notepad</title>
    <link rel="stylesheet" href="/web/live_transcription.css" />
</head>
<body>
    <div class="app-shell">
        <header class="app-header">
            <div class="brand">
                <h1>Whisper Notepad</h1>
                <p>Live dictation and translation in a familiar writing space.</p>
            </div>

            <div class="recording-panel">
                <button id="recordButton" aria-label="Toggle recording">
                    <div class="shape-container">
                        <div class="shape"></div>
                    </div>
                    <div class="recording-info">
                        <div class="wave-container">
                            <canvas id="waveCanvas"></canvas>
                        </div>
                    </div>
                </button>
                <div class="timer" aria-live="polite">00:00</div>
            </div>

            <div class="theme-selector-container">
                <div class="segmented" role="radiogroup" aria-label="Theme selector">
                    <input type="radio" id="theme-system" name="theme" value="system" />
                    <label for="theme-system" title="System">
                        <img src="/web/src/system_mode.svg" alt="" />
                        <span>System</span>
                    </label>

                    <input type="radio" id="theme-light" name="theme" value="light" />
                    <label for="theme-light" title="Light">
                        <img src="/web/src/light_mode.svg" alt="" />
                        <span>Light</span>
                    </label>

                    <input type="radio" id="theme-dark" name="theme" value="dark" />
                    <label for="theme-dark" title="Dark">
                        <img src="/web/src/dark_mode.svg" alt="" />
                        <span>Dark</span>
                    </label>
                </div>
            </div>
        </header>

        <section class="controls">
            <div class="connection-settings">
                <div class="field">
                    <label for="websocketInput">Dictation WebSocket</label>
                    <input id="websocketInput" type="text" placeholder="ws://host:port/asr" />
                </div>

                <div class="field">
                    <label for="translationWebsocketInput">Translation WebSocket</label>
                    <input id="translationWebsocketInput" type="text" placeholder="ws://host:port/asr?task=translate" />
                </div>

                <label class="toggle">
                    <input id="translationToggle" type="checkbox" />
                    <span>Enable live translation</span>
                </label>
            </div>

            <div class="hardware-settings">
                <div class="field">
                    <label id="microphoneSelectLabel" for="microphoneSelect">Select microphone</label>
                    <select id="microphoneSelect">
                        <option value="">Default Microphone</option>
                    </select>
                </div>
            </div>

            <div class="note-actions">
                <button id="newNoteButton" type="button">New note</button>
                <button id="continueNoteButton" type="button">Continue</button>
                <button id="saveNoteButton" type="button">Save note</button>
            </div>
        </section>

        <main class="workspace">
            <section class="notepad" id="dictationPane">
                <div class="pane-header">
                    <h2>Dictation</h2>
                </div>
                <textarea id="dictationNote" spellcheck="true" placeholder="Your dictated notes will appear here..."></textarea>
                <div class="live-preview" id="dictationPreview">
                    <span class="preview-label">Live preview</span>
                    <p class="preview-text" aria-live="polite"></p>
                </div>
            </section>

            <section class="notepad translation is-hidden" id="translationPane">
                <div class="pane-header">
                    <h2>Translation</h2>
                    <button id="saveTranslationButton" type="button">Save translation</button>
                </div>
                <textarea id="translationNote" spellcheck="false" placeholder="Translations will appear here..." readonly></textarea>
                <div class="live-preview" id="translationPreview">
                    <span class="preview-label">Live preview</span>
                    <p class="preview-text" aria-live="polite"></p>
                </div>
            </section>
        </main>

        <footer class="status-bar">
            <p id="status">Click to start transcription</p>
        </footer>
    </div>

    <script src="/web/live_transcription.js"></script>
</body>
</html>
